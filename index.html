<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Great Cookie Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Nunito:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header>
    <h1>The Great Cookie Quest</h1>
    <div class="basket" id="basket"></div>
  </header>
  <div class="screen">
    <canvas id="game" width="224" height="168"></canvas>
    <div class="prompt" id="prompt" hidden></div>
    <div class="hud" id="hud" hidden></div>
    <div class="dialog" id="dialog" hidden role="dialog" aria-live="polite">
      <div class="place" id="dplace"></div>
      <div class="speaker" id="dspeaker"></div>
      <p id="dtext"></p>
      <div class="dbtns" id="dbtns"></div>
    </div>
    <div class="reward" id="reward" hidden role="dialog" aria-labelledby="rewardName">
      <div class="rcard">
        <small id="rewardFrom"></small>
        <h3 id="rewardName"></h3>
        <button class="rart" id="rewardArt" aria-label="Add to your basket"><canvas id="rewardCanvas" width="40" height="30"></canvas></button>
        <p id="rewardHint"></p>
      </div>
    </div>
    <div class="pump" id="pump" hidden role="dialog" aria-labelledby="pumpTitle">
      <div class="pcard">
        <small id="pumpTitle"></small>
        <div class="pdisp">
          <div><span class="lbl">Sale $</span><span class="led" id="pumpSale">$0.00</span></div>
          <div><span class="lbl">Gallons</span><span class="led small" id="pumpGal">0.000</span></div>
          <div><span class="lbl">Per gal</span><span class="led small">2.79</span></div>
        </div>
        <p id="pumpMsg"></p>
        <button class="pbtn" id="pumpBtn">Hold to pump</button>
      </div>
    </div>
    <div class="shop" id="shop" hidden role="dialog" aria-labelledby="shopName">
      <div class="shophead"><h3 id="shopName"></h3><span>Wallet <b id="shopWallet"></b></span><span class="pips">Strikes <span id="shopStrikes"></span></span></div>
      <div class="alexrow"><canvas id="alexFace" width="40" height="40" aria-hidden="true"></canvas><p id="alexLine" aria-live="polite"></p></div>
      <div class="case fridgecase"><span class="caselbl">Drinks</span><div class="items" id="fridge"></div></div>
      <div class="case shelfcase"><span class="caselbl">Snacks</span><div class="items" id="shelf"></div></div>
      <button class="btn givebtn" id="giveBtn" disabled></button>
    </div>
    <div class="vault" id="vault" hidden role="dialog" aria-labelledby="vaultTitle">
      <div class="vcard">
        <small id="vaultTitle"></small>
        <p id="vaultNote"></p>
        <div class="crates">
          <button class="crate" aria-label="Left crate"><canvas id="crateA" width="32" height="30"></canvas><span>Left crate</span></button>
          <button class="crate" aria-label="Right crate"><canvas id="crateB" width="32" height="30"></canvas><span>Right crate</span></button>
        </div>
        <button class="btn" id="vaultPing"></button>
      </div>
    </div>
    <div class="titlecard" id="titlecard">
      <small>A Christmas game</small>
      <h2>The Great<br>Cookie Quest</h2>
      <p>Four lands. One basket. The best chocolate chip cookies ever made.</p>
      <button class="btn" id="startBtn">Start</button>
      <small>Work in progress</small>
    </div>
  </div>
  <div class="crewbar" id="crewbar" hidden>
    <button data-crew="0" aria-pressed="true"><canvas width="16" height="26"></canvas><span></span></button>
    <button data-crew="1" aria-pressed="false"><canvas width="16" height="26"></canvas><span></span></button>
    <button data-crew="2" aria-pressed="false"><canvas width="16" height="26"></canvas><span></span></button>
    <button class="follow" id="followBtn" aria-pressed="false">Crew: Follow</button>
  </div>
  <div class="controls">
    <div class="pad">
      <button class="u" data-dir="up" aria-label="Up">▲</button>
      <button class="l" data-dir="left" aria-label="Left">◀</button>
      <button class="r" data-dir="right" aria-label="Right">▶</button>
      <button class="d" data-dir="down" aria-label="Down">▼</button>
    </div>
    <div class="awrap"><button class="abtn" id="abtn" aria-label="Action">A</button><span class="alabel" id="alabel"></span></div>
  </div>
  <p class="hint">Arrow keys or WASD to walk · Space to talk</p>
  <button class="reset" id="resetBtn">Start over</button>
</div>

<!-- Plain scripts (no modules) so the game also runs by double-clicking index.html. Order matters. -->
<script src="js/story.js"></script>
<script src="js/world.js"></script>
<script src="js/state.js"></script>
<script src="js/input.js"></script>
<script src="js/ui.js"></script>
<script src="js/farm.js"></script>
<script src="js/kitchen.js"></script>
<script src="js/city.js"></script>
<script src="js/fargo.js"></script>
<script src="js/game.js"></script>
</body>
</html>
