<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Great Cookie Quest</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pro.css">
</head>
<body>
<div class="app">
  <div class="console" id="console">
  <div class="topbar">
    <div class="basket" id="basket"></div>
    <button class="gear" id="settingsBtn" aria-label="Menu"><canvas id="gearArt" width="11" height="11" aria-hidden="true"></canvas></button>
  </div>
  <div class="screen">
    <canvas id="game" width="224" height="168"></canvas>
    <canvas id="present" aria-hidden="true" hidden></canvas>
    <div class="prompt" id="prompt" hidden></div>
    <div class="hud" id="hud" hidden></div>
    <button class="btn minibtn" id="golfRestart" hidden>↺ Restart round</button>
    <div class="dialog" id="dialog" hidden role="dialog" aria-live="polite">
      <div class="speaker" id="dspeaker"></div>
      <div class="dscroll">
        <canvas class="portrait" id="dportrait" width="32" height="32" hidden aria-hidden="true"></canvas>
        <div class="place" id="dplace"></div>
        <p id="dtext"></p>
        <div class="dbtns" id="dbtns"></div>
      </div>
    </div>
    <div class="reward" id="reward" hidden role="dialog" aria-labelledby="rewardName">
      <div class="rcard">
        <small id="rewardFrom"></small>
        <h3 id="rewardName"></h3>
        <button class="rart" id="rewardArt" aria-label="Add to your basket"><canvas id="rewardCanvas" width="40" height="30"></canvas></button>
        <p id="rewardHint"></p>
      </div>
    </div>
    <div class="reward" id="itemCard" hidden role="dialog" aria-labelledby="itemName">
      <div class="rcard">
        <small id="itemFrom"></small>
        <h3 id="itemName"></h3>
        <div class="iart"><canvas id="itemCanvas" width="40" height="30"></canvas></div>
        <p id="itemLine"></p>
        <p class="itip" id="itemTip"></p>
        <button class="btn" id="itemBtn"></button>
      </div>
    </div>
    <div class="pump" id="pump" hidden role="dialog" aria-labelledby="pumpTitle">
      <div class="pcard">
        <small id="pumpTitle"></small>
        <div class="pdisp">
          <div><span class="lbl">Sale $</span><span class="led" id="pumpSale">$0.00</span></div>
          <div><span class="lbl">Gallons</span><span class="led small" id="pumpGal">0.000</span></div>
          <div><span class="lbl">Per gal</span><span class="led small">2.79</span></div>
        </div>
        <p id="pumpMsg"></p>
        <button class="pbtn" id="pumpBtn">Hold to pump</button>
      </div>
    </div>
    <div class="shop" id="shop" hidden role="dialog" aria-labelledby="shopName">
      <div class="shophead"><h3 id="shopName"></h3><span>Wallet <b id="shopWallet"></b></span><span class="pips">Strikes <span id="shopStrikes"></span></span></div>
      <div class="alexrow"><canvas id="alexFace" width="40" height="40" aria-hidden="true"></canvas><p id="alexLine" aria-live="polite"></p></div>
      <div class="case fridgecase"><span class="caselbl">Drinks</span><div class="items" id="fridge"></div></div>
      <div class="case shelfcase"><span class="caselbl">Snacks</span><div class="items" id="shelf"></div></div>
      <button class="btn givebtn" id="giveBtn" disabled></button>
    </div>
    <div class="vault" id="vault" hidden role="dialog" aria-labelledby="vaultTitle">
      <div class="vcard">
        <small id="vaultTitle"></small>
        <p id="vaultNote"></p>
        <p class="vrule" id="vaultRule"></p>
        <div class="crates">
          <button class="crate" id="crate0"><canvas id="crateArt0" width="32" height="30"></canvas><b>Left</b><span id="crateLabel0"></span></button>
          <button class="crate" id="crate1"><canvas id="crateArt1" width="32" height="30"></canvas><b>Middle</b><span id="crateLabel1"></span></button>
          <button class="crate" id="crate2"><canvas id="crateArt2" width="32" height="30"></canvas><b>Right</b><span id="crateLabel2"></span></button>
        </div>
        <button class="btn ghost" id="vaultHint"></button>
        <p class="vhint" id="vaultHintText" hidden></p>
      </div>
    </div>
    <div class="vault" id="boss" hidden role="dialog" aria-labelledby="bossTitle">
      <div class="vcard bosscard">
        <small id="bossTitle"></small>
        <canvas id="bossArt" width="128" height="64" aria-hidden="true"></canvas>
        <p id="bossMsg" aria-live="polite"></p>
        <div class="bossbar" aria-hidden="true"><i id="bossFill"></i></div>
        <button class="pbtn" id="bossBtn"></button>
      </div>
    </div>
    <div class="anagram" id="anagram" hidden role="dialog" aria-labelledby="anaTitle">
      <div class="acard">
        <div class="ahead"><h3 id="anaTitle"></h3><span class="atime" id="anaTime">60</span></div>
        <div class="ascores"><span>Joe <b id="anaYou">0</b></span><span>Lars <b id="anaLars">0</b></span></div>
        <p id="anaMsg" aria-live="polite"></p>
        <button class="btn" id="anaStart"></button>
        <div id="anaPlay" hidden>
          <div class="aword" id="anaWord"> </div>
          <div class="tiles" id="anaTiles"></div>
          <div class="acontrols"><button class="btn ghost" id="anaClear">Clear</button><button class="btn ghost" id="anaBack">⌫</button><button class="btn" id="anaEnter">Enter</button></div>
          <p class="afound" id="anaFound"></p>
          <p class="alars" id="anaLarsWord"></p>
        </div>
        <div id="anaEnd" hidden><p class="aresult" id="anaResult"></p><p id="anaMissed"></p><button class="btn" id="anaNext"></button></div>
      </div>
    </div>
    <div class="howto" id="howto" hidden role="dialog" aria-labelledby="howTitle">
      <h3 id="howTitle"></h3>
      <div id="howRows"></div>
      <ul id="howControls"></ul>
      <button class="btn" id="howOk"></button>
    </div>
    <div class="wardrobe" id="wardrobe" hidden role="dialog" aria-labelledby="wardTitle">
      <div class="vcard">
        <small id="wardTitle"></small>
        <p id="wardIntro"></p>
        <div class="outfits" id="outfits"></div>
        <p class="wline" id="wardLine"></p>
        <button class="btn" id="wardGo"></button>
      </div>
    </div>
    <div class="bake" id="bake" hidden role="dialog" aria-labelledby="bakeTitle">
      <div class="pcard bcard">
        <small id="bakeTitle"></small>
        <div class="bstep" id="bakeStep"></div>
        <canvas id="bakeArt" width="96" height="64" aria-hidden="true"></canvas>
        <div class="bsay"><canvas id="bakeFace" width="40" height="40" aria-hidden="true"></canvas><p id="bakeMsg" aria-live="polite"></p></div>
        <div class="brow"><button class="pbtn" id="bakeBtn"></button><button class="btn ghost" id="bakeAlt" hidden></button></div>
      </div>
    </div>
    <div class="bake" id="cloverHunt" hidden role="dialog" aria-labelledby="cloverTitle">
      <div class="pcard bcard clovercard">
        <small id="cloverTitle"></small>
        <div class="bsay"><canvas id="cloverFace" width="32" height="32" aria-hidden="true"></canvas><p id="cloverMsg" aria-live="polite"></p></div>
        <div class="cloverfield" id="cloverField"></div>
        <div class="brow"><button class="btn ghost" id="cloverLater"></button></div>
      </div>
    </div>
    <div class="alexhint radio" id="radio" hidden><canvas id="radioFace" width="40" height="40" aria-hidden="true"></canvas><div><b id="radioWho"></b><p id="radioText" aria-live="polite"></p></div></div>
    <div class="roundbanner" id="roundBanner" hidden aria-live="polite"><b id="roundTitle"></b><span id="roundSub"></span></div>
    <div class="alexhint radio caption" id="caption" hidden><div><b id="captionWho"></b><p id="captionText" aria-live="polite"></p></div></div>
    <div class="alexhint" id="hint" hidden><canvas id="hintFace" width="40" height="40" aria-hidden="true"></canvas><p id="hintText" aria-live="polite"></p></div>
    <div class="ending" id="ending" hidden role="dialog" aria-label="The end">
      <div class="credits" id="credits"><div class="roll" id="creditRoll"></div></div>
      <div class="ecard" id="ecard" hidden></div>
      <div class="ebtns"><button class="btn ghost" id="endSkip"></button><button class="btn" id="endNext"></button></div>
    </div>
    <div class="wardrobe" id="settings" hidden role="dialog" aria-labelledby="setTitle">
      <div class="vcard">
        <small id="setTitle">Settings</small>
        <button class="btn" id="setOutfit"></button>
        <button class="btn" id="setAlbum">Photo album</button>
        <label class="srow"><span>Sound</span><input type="checkbox" role="switch" id="soundToggle"></label>
        <label class="srow"><span>Music</span><input type="checkbox" role="switch" id="musicToggle"></label>
        <div id="gearRows" hidden></div>
        <button class="reset" id="resetBtn">Start over</button>
        <button class="btn ghost" id="settingsClose">Close</button>
      </div>
    </div>
    <div class="titlecard" id="titlecard">
      <canvas id="titleArt" width="128" height="96" aria-hidden="true"></canvas>
      <div class="tcontent">
        <small>To: Joe </small>
        <h2>The Great<br>Cookie Quest</h2>
        <p>Can you locate all the ingredients to bake the perfect chocolate chip cookies?</p>
        <button class="btn big pulse" id="startBtn">Start</button>
        <p class="tkeys">Arrow keys or WASD to walk · Space to talk</p>
      </div>
    </div>
  </div>
  </div>
  <div class="crewbar" id="crewbar" hidden>
    <button data-crew="0" aria-pressed="true"><canvas width="16" height="26"></canvas><span></span></button>
    <button data-crew="1" aria-pressed="false"><canvas width="16" height="26"></canvas><span></span></button>
    <button data-crew="2" aria-pressed="false"><canvas width="16" height="26"></canvas><span></span></button>
    <button class="follow" id="followBtn" aria-pressed="false">Crew: Follow</button>
    <button class="follow help" id="helpBtn" aria-label="How to play">?</button>
  </div>
  <div class="controls">
    <div class="pad">
      <button class="u" data-dir="up" aria-label="Up">▲</button>
      <button class="l" data-dir="left" aria-label="Left">◀</button>
      <button class="r" data-dir="right" aria-label="Right">▶</button>
      <button class="d" data-dir="down" aria-label="Down">▼</button>
    </div>
    <div class="awrap"><button class="abtn" id="abtn" aria-label="Action">A</button><span class="alabel" id="alabel"></span></div>
  </div>
</div>

<!-- Plain scripts (no modules) so the game also runs by double-clicking index.html. Order matters. -->
<script src="js/story.js"></script>
<script src="js/world.js"></script>
<script src="js/state.js"></script>
<script src="js/sound.js"></script>
<script src="js/input.js"></script>
<script src="js/ui.js"></script>
<script src="js/farm.js"></script>
<script src="js/kitchen.js"></script>
<script src="js/city.js"></script>
<script src="js/fargo.js"></script>
<script src="js/portraits.js"></script>
<script src="js/confectioner.js"></script>
<script src="js/anagrams.js"></script>
<script src="js/larsgames.js"></script>
<script src="js/golf.js"></script>
<script src="js/birkie.js"></script>
<script src="js/people.js"></script>
<script src="js/ending.js"></script>
<script src="js/extras.js"></script>
<script src="js/outline.js"></script>
<script src="js/game.js"></script>
<script src="js/title.js"></script>
<script src="js/layout.js"></script>
<script src="js/devskip.js"></script>   <!-- testing only: delete this line and js/devskip.js before giving it to Joe -->
</body>
</html>
